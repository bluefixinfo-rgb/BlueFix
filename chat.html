<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0a1a33">
<meta name="robots" content="noindex">
<title>BlueFix Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{margin:0; height:100%; background:#04070d; color:#f5f8ff; font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none;}
button,input,textarea{font-family:inherit;}
[hidden]{display:none !important;}

/* Die Seite folgt dem sichtbaren Bereich (Handy-Tastatur) -> Eingabe bleibt immer sichtbar */
#app{position:fixed; left:0; right:0; top:0; height:100%; display:flex; align-items:center; justify-content:center; background:#04070d;}
.bfc-win{position:relative; display:flex; flex-direction:column; width:100%; height:100%; min-height:0; background:#070d18; overflow:hidden;}
@media (min-width:640px){
  #app{background:radial-gradient(ellipse at 50% 0%,#0d2547 0%,#04070d 70%);}
  .bfc-win{width:440px; height:680px; max-height:calc(100% - 48px); border-radius:20px; border:1px solid #1c2b45; box-shadow:0 30px 80px rgba(0,0,0,.65);}
}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #4a9cff; outline-offset:2px;}

/* Kopfzeile */
.bfc-head{flex:none; display:flex; align-items:center; gap:12px; padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px 10px; background:linear-gradient(135deg,#0d2547,#0a1a33); border-bottom:1px solid #1c2b45;}
@media (min-width:640px){.bfc-head{padding-top:12px;}}
.bfc-back{flex:none; width:40px; height:40px; border-radius:50%; border:1px solid #1c2b45; background:rgba(255,255,255,.04); color:#c9d6f0; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent;}
.bfc-back:hover{background:rgba(255,255,255,.12); color:#fff;}
.bfc-back svg{width:20px; height:20px;}
.bfc-av{position:relative; width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#4a9cff,#1e6fef); display:flex; align-items:center; justify-content:center; font:700 18px 'Space Grotesk',sans-serif; flex:none;}
.bfc-av::after{content:""; position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; background:#2fbf71; border:2px solid #0a1a33;}
.bfc-ti{flex:1; min-width:0;}
.bfc-ti b{display:block; font:600 16px 'Space Grotesk',sans-serif;}
.bfc-ti span{display:block; font-size:12px; color:#8a99b8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#app.compact .bfc-head{padding-top:6px; padding-bottom:6px;}
#app.compact .bfc-av{width:32px; height:32px; font-size:15px;}
#app.compact .bfc-ti span{display:none;}

.bfc-view{flex:1; min-height:0; display:flex; flex-direction:column;}

/* Name zuerst */
.bfc-gate{background:#0b1322; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:24px 26px calc(24px + env(safe-area-inset-bottom,0px));}
.bfc-gate-in{margin:auto; width:100%; max-width:320px; text-align:center;}
.bfc-gate-ico{width:56px; height:56px; margin:0 auto 18px; border-radius:16px; background:rgba(30,111,239,.14); border:1px solid #1a3a63; color:#4a9cff; display:flex; align-items:center; justify-content:center;}
.bfc-gate-ico svg{width:26px; height:26px;}
.bfc-gate h2{margin:0 0 8px; font:600 22px 'Space Grotesk',sans-serif; letter-spacing:.2px;}
.bfc-gate p{margin:0 0 22px; font-size:14.5px; line-height:1.5; color:#8a99b8;}
.bfc-gate form{display:flex; flex-direction:column; gap:8px; text-align:left;}
.bfc-gate label{font-size:13px; font-weight:500; color:#c9d6f0;}
.bfc-gate input{width:100%; background:#0d1a2e; border:1px solid #1c2b45; color:#f5f8ff; border-radius:12px; padding:13px 15px; font:16px 'Inter',sans-serif; transition:border-color .15s, box-shadow .15s;}
.bfc-gate input:focus{outline:none; border-color:#4a9cff; box-shadow:0 0 0 3px rgba(74,156,255,.18);}
.bfc-gate-err{min-height:18px; font-size:12.5px; color:#ff9a9a;}
.bfc-go{width:100%; padding:14px; border:none; border-radius:12px; background:linear-gradient(135deg,#4a9cff,#1e6fef); color:#fff; font:600 15px 'Inter',sans-serif; cursor:pointer; box-shadow:0 8px 22px -8px rgba(30,111,239,.7); transition:transform .15s, filter .15s;}
.bfc-go:hover{filter:brightness(1.08);}
.bfc-go:active{transform:scale(.98);}
.bfc-note{margin-top:16px; font-size:12px; line-height:1.45; color:#6d7d9c;}

/* Nachrichten */
.bfc-msgs{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:14px 12px; display:flex; flex-direction:column; gap:8px; background:#0b1322;}
.bfc-sys{align-self:center; font-size:12px; color:#8a99b8; padding:4px 0;}
.bfc-row{display:flex; flex-direction:column; max-width:82%;}
.bfc-row.me{align-self:flex-end; align-items:flex-end;}
.bfc-row.them{align-self:flex-start; align-items:flex-start;}
.bfc-who{font-size:11.5px; color:#8a99b8; margin:0 4px 3px;}
.bfc-b{padding:10px 14px; border-radius:18px; font-size:15px; line-height:1.4; white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;}
.bfc-row.me .bfc-b{background:linear-gradient(135deg,#2f7ce0,#14488f); color:#fff; border-bottom-right-radius:5px;}
.bfc-row.them .bfc-b{background:#f5f8ff; color:#0b1322; border-bottom-left-radius:5px;}
.bfc-meta{font-size:11px; color:#8a99b8; margin:3px 4px 0;}
.bfc-err{flex:none; display:none; color:#ff9a9a; font-size:12.5px; text-align:center; padding:6px 12px; background:#070d18;}

/* Eingabe: bleibt immer fest am unteren Rand */
.bfc-in{flex:none; display:flex; gap:8px; align-items:flex-end; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); background:#070d18; border-top:1px solid #1c2b45;}
.bfc-in textarea{flex:1; min-width:0; min-height:44px; max-height:110px; margin:0; display:block; background:#0d1a2e; border:1px solid #1c2b45; color:#f5f8ff; border-radius:22px; padding:11px 16px; font:16px/1.35 'Inter',sans-serif; resize:none; overflow-y:hidden; transition:border-color .15s, box-shadow .15s;}
.bfc-in textarea:focus{outline:none; border-color:#4a9cff; box-shadow:0 0 0 3px rgba(74,156,255,.18);}
.bfc-send{width:44px; height:44px; border-radius:50%; border:none; background:linear-gradient(135deg,#4a9cff,#1e6fef); color:#fff; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; transition:opacity .15s; -webkit-tap-highlight-color:transparent;}
.bfc-send:disabled{opacity:.4; cursor:default;}
.bfc-send svg{width:20px; height:20px;}


.bfc-typing .bfc-b{display:flex; gap:5px; align-items:center; padding:13px 16px;}
.bfc-typing i{width:7px; height:7px; border-radius:50%; background:#8a99b8; animation:bfDot 1.2s infinite ease-in-out;}
.bfc-typing i:nth-child(2){animation-delay:.18s;} .bfc-typing i:nth-child(3){animation-delay:.36s;}
@keyframes bfDot{0%,80%,100%{opacity:.25; transform:translateY(0);}40%{opacity:1; transform:translateY(-3px);}}
</style>
</head>
<body>
<div id="app">
  <div class="bfc-win" id="bfcWin">
    <div class="bfc-head">
      <button class="bfc-back" id="bfcBack" type="button" aria-label="Zurück zur Website"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="bfc-av">B</div>
      <div class="bfc-ti"><b>BlueFix Assistent</b><span id="bfcSub">KI-Assistent · antwortet sofort</span></div>
    </div>

    <!-- Schritt 1: Name -->
    <div class="bfc-view bfc-gate" id="bfcGate">
      <div class="bfc-gate-in">
        <div class="bfc-gate-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
        <h2>Willkommen bei BlueFix</h2>
        <p>Wie dürfen wir dich nennen? Danach startet dein Chat.</p>
        <form id="bfcGateForm" novalidate>
          <label for="bfcNameIn">Dein Name</label>
          <input id="bfcNameIn" type="text" maxlength="40" placeholder="z. B. Lena" autocomplete="given-name" autocapitalize="words" enterkeyhint="go">
          <div class="bfc-gate-err" id="bfcGateErr" role="alert"></div>
          <button class="bfc-go" type="submit">Chat starten</button>
        </form>
        <div class="bfc-note">Dein Name wird nur für die Anrede im Chat und für unser Team verwendet.</div>
      </div>
    </div>

    <!-- Schritt 2: Chat -->
    <div class="bfc-view" id="bfcChatView" hidden>
      <div class="bfc-msgs" id="bfcMsgs" aria-live="polite"></div>
      <div class="bfc-err" id="bfcErr" role="alert"></div>
      <div class="bfc-in">
        <textarea id="bfcIn" rows="1" maxlength="1000" placeholder="Nachricht schreiben …" aria-label="Nachricht" enterkeyhint="send"></textarea>
        <button class="bfc-send" id="bfcSend" type="button" aria-label="Senden" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  /* Gleiche Firebase-Datenbank wie das Admin-Panel. */
  var FB_CONFIG = {
    apiKey: "AIzaSyCKLqJ-YW_PQ0MRFHQLMZaKWaPc28ScSE8",
    authDomain: "bluefix-2255.firebaseapp.com",
    projectId: "bluefix-2255",
    appId: "1:317301627140:web:cc37ea8ca5d7a8caf71851"
  };
  var NOTIFY_URL = 'https://bluefix-website.vercel.app/api/chat-notify';
  var AI_URL = 'https://bluefix-website.vercel.app/api/chat-ai';
  var HOME_URL = 'homepage.html';
  var AI_FAIL_TEXT = 'Danke für deine Nachricht! Das Team meldet sich innerhalb von 24 Stunden bei dir. Dringend? Ruf uns an: 076 229 91 82.';

  var mem = {};
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] || null; } }
  function lsSet(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} delete mem[k]; }
  function newSid(){
    var a = new Uint8Array(10);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function(x){ return ('0'+x.toString(16)).slice(-2); }).join('');
  }
  var sid = lsGet('bf_chat_sid');
  if (!sid || !/^[a-f0-9]{16,40}$/.test(sid)) { sid = newSid(); lsSet('bf_chat_sid', sid); }
  var short = sid.slice(0,4).toUpperCase();

  var $ = function(id){ return document.getElementById(id); };
  var app=$('app'), msgsEl=$('bfcMsgs'), inp=$('bfcIn'), sendBtn=$('bfcSend'), errEl=$('bfcErr'), subEl=$('bfcSub'),
      gate=$('bfcGate'), chatView=$('bfcChatView'), gateForm=$('bfcGateForm'), nameIn=$('bfcNameIn'), gateErr=$('bfcGateErr');

  var db=null, sRef=null, unsubMsgs=null, unsubSess=null, initPromise=null;
  var sessSeen=false, msgs=[], sess={}, lastSend=0, aiWaitUntil=0, aiTimer=null, aiFailAfter=0;
  var sending=false;

  var LETTER; try { LETTER = new RegExp('\\p{L}','u'); } catch(e){ LETTER = /[A-Za-zÀ-ɏ]/; }
  function cleanName(v){ return String(v || '').replace(/\s+/g,' ').trim().slice(0,40); }
  function getName(){ return cleanName(lsGet('bf_chat_name')); }
  function isMobileLayout(){ return window.innerWidth < 640; }

  function loadScript(src){
    return new Promise(function(res,rej){
      var s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=function(){ rej(new Error('load '+src)); };
      document.head.appendChild(s);
    });
  }
  function init(){
    if (initPromise) return initPromise;
    initPromise = (async function(){
      if (!window.firebase) {
        await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js');
      }
      var app_ = firebase.apps.length ? firebase.app() : firebase.initializeApp(FB_CONFIG);
      db = firebase.firestore(app_);
      try { db.settings({ experimentalAutoDetectLongPolling:true, useFetchStreams:false, merge:true }); } catch(e){}
      sRef = db.collection('livechat_sessions').doc(sid);
      listen();
    })();
    initPromise.catch(function(){ initPromise = null; });
    return initPromise;
  }

  function listen(){
    if (unsubSess) unsubSess();
    if (unsubMsgs) unsubMsgs();
    unsubSess = sRef.onSnapshot(function(d){
      /* Admin hat den Chat geloescht -> komplett neu starten */
      if (!d.metadata.fromCache && !d.metadata.hasPendingWrites) {
        if (d.exists) sessSeen = true;
        else if (sessSeen || lsGet('bf_chat_started')) { resetChat(); return; }
      }
      sess = d.exists ? d.data() : {};
      render(); markSeen();
    }, function(){});
    unsubMsgs = sRef.collection('messages').orderBy('ts').onSnapshot(function(snap){
      msgs = snap.docs.map(function(x){ return x.data(); });
      var last = msgs[msgs.length-1];
      if (last && last.from !== 'visitor') { aiWaitUntil = 0; aiFailAfter = 0; }
      render(); markSeen();
    }, function(){});
  }

  function resetChat(){
    if (unsubSess) { unsubSess(); unsubSess = null; }
    if (unsubMsgs) { unsubMsgs(); unsubMsgs = null; }
    ['bf_chat_started','bf_chat_name','bf_chat_open_ping'].forEach(lsDel);
    sid = newSid(); lsSet('bf_chat_sid', sid); short = sid.slice(0,4).toUpperCase();
    sRef = db.collection('livechat_sessions').doc(sid);
    msgs = []; sess = {}; sessSeen = false; aiWaitUntil = 0; aiFailAfter = 0; clearTimeout(aiTimer);
    inp.value = ''; autosize(); nameIn.value = ''; gateErr.textContent = ''; showErr('');
    showView(); render(); updateSend();
    listen();
  }

  function markSeen(){
    if (!sRef || !(sess.unreadVisitor > 0) || document.visibilityState !== 'visible') return;
    sRef.set({ unreadVisitor: 0, visitorSeenAt: Date.now() }, { merge:true }).catch(function(){});
  }

  function hm(ts){ var d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
  function el(tag, cls, txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }

  function showView(){
    var name = getName();
    gate.hidden = !!name;
    chatView.hidden = !name;
    subEl.textContent = name ? 'Du schreibst als ' + name : 'KI-Assistent · antwortet sofort';
  }

  function render(){
    if (!getName()) return;
    var nearBottom = msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight < 120;
    msgsEl.innerHTML = '';
    msgsEl.appendChild(el('div','bfc-sys','Chat gestartet'));
    var w = el('div','bfc-row them');
    w.appendChild(el('div','bfc-who','BlueFix'));
    w.appendChild(el('div','bfc-b','Hallo ' + getName() + '! 👋 Ich bin der KI-Assistent von BlueFix. Wie kann ich dir helfen? Schreib mir einfach, welches Handy du hast und was kaputt ist, dann sage ich dir direkt, was die Reparatur kostet. Wenn du eine Reparatur machen lassen möchtest, nehme ich deinen Auftrag gleich hier auf. Danach meldet sich das Team innerhalb von 24 Stunden bei dir.'));
    msgsEl.appendChild(w);
    var lastMe = -1;
    msgs.forEach(function(m,i){ if (m.from==='visitor') lastMe = i; });
    msgs.forEach(function(m,i){
      var me = m.from === 'visitor';
      var row = el('div','bfc-row ' + (me ? 'me' : 'them'));
      if (!me) row.appendChild(el('div','bfc-who', m.ai ? '🤖 BlueFix KI-Assistent' : ((m.agent || 'BlueFix') + ' | BlueFix Team')));
      row.appendChild(el('div','bfc-b',m.text));
      var meta = hm(m.ts);
      if (me && i === lastMe) meta += (sess.teamReadAt && sess.teamReadAt >= m.ts) ? ' · ✓✓ Gelesen' : ' · ✓ Gesendet';
      row.appendChild(el('div','bfc-meta',meta));
      msgsEl.appendChild(row);
    });
    var lastMsg = msgs[msgs.length-1];
    var waiting = lastMsg && lastMsg.from === 'visitor';
    if (waiting && Date.now() < aiWaitUntil) {
      var tr = el('div','bfc-row them bfc-typing'); tr.appendChild(el('div','bfc-who','🤖 BlueFix KI-Assistent'));
      var tb = el('div','bfc-b'); tb.innerHTML = '<i></i><i></i><i></i>'; tr.appendChild(tb); msgsEl.appendChild(tr);
      nearBottom = true;
      clearTimeout(aiTimer); aiTimer = setTimeout(render, Math.max(200, aiWaitUntil - Date.now() + 50));
    } else if (waiting && aiFailAfter && lastMsg.ts <= aiFailAfter) {
      /* KI konnte nicht antworten -> der Kunde bleibt nie ohne Rueckmeldung */
      var fr = el('div','bfc-row them'); fr.appendChild(el('div','bfc-who','BlueFix'));
      fr.appendChild(el('div','bfc-b',AI_FAIL_TEXT)); msgsEl.appendChild(fr);
      nearBottom = true;
    }
    if (nearBottom || msgs.length <= 1) msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function showErr(t){ errEl.textContent = t || ''; errEl.style.display = t ? 'block' : 'none'; }

  function autosize(){
    inp.style.height = 'auto';
    var h = Math.min(inp.scrollHeight + 2, 110);
    inp.style.height = h + 'px';
    inp.style.overflowY = inp.scrollHeight + 2 > 110 ? 'auto' : 'hidden';
  }
  function updateSend(){ sendBtn.disabled = sending || !inp.value.trim(); }

  /* KI-Funktion aufrufen. Bei Fehler einmal wiederholen; klappt es gar nicht, kommt die Hinweis-Nachricht. */
  function askAI(attempt){
    var sentAt = Date.now();
    return fetch(AI_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ sid: sid }) })
      .then(function(r){
        return r.json().catch(function(){ return {}; }).then(function(j){ return { status:r.status, j:j || {} }; });
      })
      .then(function(o){
        if (o.status >= 400 || (o.j && o.j.ok === false)) { try { console.warn('[BlueFix KI]', o.status, o.j); } catch(e){} throw new Error('ai ' + o.status); }
        if (o.j && o.j.ok) setTimeout(function(){ aiWaitUntil = 0; render(); }, 1500);
        else { aiWaitUntil = 0; render(); } /* z.B. Mitarbeiter hat uebernommen */
      })
      .catch(function(){
        if (attempt < 1) { return new Promise(function(r){ setTimeout(r, 1500); }).then(function(){ return askAI(attempt + 1); }); }
        aiWaitUntil = 0; aiFailAfter = Date.now() + 5000; render();
      });
  }

  async function send(){
    var text = inp.value.trim().slice(0,1000);
    var name = getName();
    if (!name) { showView(); return; }
    if (!text || sending || Date.now() - lastSend < 700) return;
    lastSend = Date.now();
    sending = true; updateSend(); showErr('');
    try {
      await init();
      var started = parseInt(lsGet('bf_chat_started') || '0', 10);
      if (!started) { started = Date.now(); lsSet('bf_chat_started', String(started)); }
      var now = Date.now();
      var batch = db.batch();
      batch.set(sRef, {
        name: name, short: short, createdAt: started,
        lastMessageAt: now, lastText: text.slice(0,140), lastFrom: 'visitor', lastEventAt: now, lastEventKind: 'msg',
        unreadTeam: firebase.firestore.FieldValue.increment(1),
        page: 'chat'
      }, { merge:true });
      batch.set(sRef.collection('messages').doc(), { from:'visitor', text: text, ts: now });
      await batch.commit();
      inp.value = ''; autosize();
      try { fetch(NOTIFY_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ sid: sid }), keepalive:true }).catch(function(){}); } catch(e){}
      aiFailAfter = 0; aiWaitUntil = Date.now() + 25000; render();
      askAI(0);
      if (isMobileLayout()) { try { inp.focus(); } catch(e){} }
    } catch(e) {
      showErr('Nachricht konnte nicht gesendet werden. Bitte Internetverbindung prüfen – oder ruf uns direkt an.');
    } finally { sending = false; updateSend(); }
  }

  /* ---- Fenstergroesse folgt dem sichtbaren Bereich (Handy-Tastatur) ---- */
  var vv = window.visualViewport;
  function fit(){
    var h = vv ? vv.height : window.innerHeight;
    app.style.top = (vv ? vv.offsetTop : 0) + 'px';
    app.style.height = h + 'px';
    app.classList.toggle('compact', h < 480);
    if (window.scrollY) window.scrollTo(0, 0);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function(){ setTimeout(fit, 250); });
  fit();
  sendBtn.addEventListener('mousedown', function(e){ e.preventDefault(); });

  function announceOpen(){
    var last = parseInt(lsGet('bf_chat_open_ping') || '0', 10), now = Date.now();
    if (now - last < 30*60*1000) return;
    lsSet('bf_chat_open_ping', String(now));
    sRef.set({ lastEventAt: now, lastEventKind: 'open', openedAt: now, name: (getName() || 'Besucher'), short: short, page: 'chat' }, { merge:true })
      .then(function(){
        try { fetch(NOTIFY_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({ sid: sid, event: 'open' }), keepalive:true }).catch(function(){}); } catch(e){}
      }).catch(function(){});
  }

  /* Zurueck zur Website */
  function goBack(){
    var sameSite = false;
    try { sameSite = document.referrer && new URL(document.referrer).origin === location.origin; } catch(e){}
    if (sameSite && history.length > 1) history.back(); else location.href = HOME_URL;
  }
  $('bfcBack').addEventListener('click', goBack);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') goBack(); });

  gateForm.addEventListener('submit', function(e){
    e.preventDefault();
    var n = cleanName(nameIn.value);
    if (n.length < 2 || !LETTER.test(n)) {
      gateErr.textContent = 'Bitte gib deinen Namen ein (mindestens 2 Buchstaben).';
      try { nameIn.focus(); } catch(x){}
      return;
    }
    gateErr.textContent = '';
    lsSet('bf_chat_name', n);
    showView(); render(); updateSend();
    init().then(function(){ announceOpen(); }).catch(function(){});
    setTimeout(function(){ msgsEl.scrollTop = msgsEl.scrollHeight; if (!isMobileLayout()) { try { inp.focus(); } catch(x){} } }, 30);
  });
  nameIn.addEventListener('input', function(){ if (gateErr.textContent) gateErr.textContent = ''; });
  sendBtn.addEventListener('click', send);
  inp.addEventListener('input', function(){ autosize(); updateSend(); });
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(hover: hover)').matches) { e.preventDefault(); send(); }
  });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') markSeen(); });


  /* Start */
  showView(); render(); updateSend();
  init().then(function(){ render(); markSeen(); if (getName()) announceOpen(); })
        .catch(function(){ showErr('Chat konnte nicht geladen werden. Bitte später erneut versuchen.'); });
  if (!isMobileLayout()) { setTimeout(function(){ try { (getName() ? inp : nameIn).focus(); } catch(e){} }, 80); }
})();
</script>
</body>
</html>
